<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumper Web: Analizador de Métrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Jumper Web</h1>
            <p class="text-slate-600">Analizador automático de métrica y acentuación en tiempo real.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Input Section -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Tendencia Versal</label>
                    <input type="text" id="trendInput" 
                           class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all mono text-sm"
                           placeholder="Auto: (detectado automáticamente)">
                    <p class="mt-2 text-xs text-slate-500">Ej: 11, 7 o dejar en blanco para detección automática.</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col h-[500px]">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Poema</label>
                    <textarea id="poemInput" 
                              class="flex-1 w-full p-4 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all mono text-sm resize-none"
                              placeholder="Escribe o pega tu poema aquí..."></textarea>
                </div>
            </div>

            <!-- Analysis Section -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                        <h2 class="font-semibold text-slate-700">Análisis Métrico</h2>
                        <div id="statusInfo" class="text-sm font-medium text-slate-600"></div>
                    </div>
                    
                    <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-50 sticky top-0 z-10">
                                <tr>
                                    <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">N</th>
                                    <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">Verso</th>
                                    <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">Síl.</th>
                                    <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">Acentos</th>
                                    <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">Tipo</th>
                                    <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200 text-right">%</th>
                                </tr>
                            </thead>
                            <tbody id="resultsBody" class="divide-y divide-slate-100 mono text-sm">
                                <!-- Results will be injected here -->
                                <tr>
                                    <td colspan="6" class="px-4 py-12 text-center text-slate-400 italic">
                                        Introduce un poema para ver el análisis.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="mt-12 pt-8 border-t border-slate-200 text-center text-slate-500 text-sm">
            <p>Jumper Web &copy; 2026 - Basado en el motor de métrica de Guillermo Marco Remón.</p>
        </footer>
    </div>

    <script>
        const poemInput = document.getElementById('poemInput');
        const trendInput = document.getElementById('trendInput');
        const resultsBody = document.getElementById('resultsBody');
        const statusInfo = document.getElementById('statusInfo');
        
        let debounceTimer;

        function analyze() {
            const text = poemInput.value.trim();
            const trend = trendInput.value.trim();

            if (!text) {
                resultsBody.innerHTML = '<tr><td colspan="6" class="px-4 py-12 text-center text-slate-400 italic">Introduce un poema para ver el análisis.</td></tr>';
                statusInfo.textContent = '';
                return;
            }

            fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, trend })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    console.error('Error:', data.error);
                    return;
                }

                // Update trend input if it was automatic
                if (!trend || trend.startsWith('Auto:')) {
                    trendInput.value = 'Auto: ' + data.tendencia.join(', ');
                }

                // Update Status
                statusInfo.textContent = `Precisión: ${data.calidad}% | Regularidad: ${data.regularidad}%`;

                // Update Table
                resultsBody.innerHTML = data.results.map(row => `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-4 py-3 text-slate-400 border-b border-slate-100">${row.n}</td>
                        <td class="px-4 py-3 border-b border-slate-100 ${row.color_class}">${row.verse}<br><span class="text-[10px] text-slate-400 font-normal">${row.analyzed}</span></td>
                        <td class="px-4 py-3 border-b border-slate-100 font-semibold">${row.syllables}</td>
                        <td class="px-4 py-3 border-b border-slate-100 text-xs">${row.accents}</td>
                        <td class="px-4 py-3 border-b border-slate-100 text-xs text-slate-500">${row.type}</td>
                        <td class="px-4 py-3 border-b border-slate-100 text-right font-medium ${row.ratio === 100 ? 'text-green-600' : 'text-slate-400'}">${row.ratio}%</td>
                    </tr>
                `).join('');
            })
            .catch(err => console.error('Fetch error:', err));
        }

        poemInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(analyze, 300);
        });

        trendInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(analyze, 500);
        });
    </script>
</body>
</html>
